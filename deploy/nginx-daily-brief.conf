server {
    listen 8180;
    server_name _;

    root /www/daily-brief;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Admin console and the writer page both come from daily-brief-admin.service
    # on 127.0.0.1:8183. The path is forwarded unchanged — the app strips the
    # /admin or /editor prefix itself, so each entry renders its own view while
    # sharing one process, one token, and one piece job queue.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8183;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /editor {
        return 301 /editor/;
    }

    location /editor/ {
        proxy_pass http://127.0.0.1:8183;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/daily-brief.access.log;
    error_log  /var/log/nginx/daily-brief.error.log;
}
